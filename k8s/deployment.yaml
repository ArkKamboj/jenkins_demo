apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicdproj-deployment
  labels:
    app: cicdproj
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicdproj
  template:
    metadata:
      labels:
        app: cicdproj
    spec:
      containers:
      - name: cicdproj
        image: cicdproj:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
